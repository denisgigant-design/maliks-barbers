<!doctype html>
<html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141310"><title>Malik’s Barbers</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#141310;color:#fffaf1;font:15px/1.4 "DM Sans",Arial,sans-serif;color-scheme:dark}
main{height:100%;height:100svh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.stage{height:100%;position:sticky;top:0;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.stage::before{content:"";position:absolute;z-index:-2;inset:-7%;background:linear-gradient(transparent,#11110fe6),center/cover url(storefront.jpg);filter:blur(34px) brightness(.55)}
.scene{width:min(100%,calc((100svh - 76px)*16/9));aspect-ratio:16/9;position:relative;mask-image:linear-gradient(black 84%,transparent)}
video,.screen{display:block;width:100%;height:100%;position:absolute;inset:0}.screen{pointer-events:none}.screen[hidden]{display:none}
footer{display:flex;align-items:center;justify-content:space-between;width:min(90%,1200px);min-height:64px;gap:16px}button{color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}.pill,dialog button{border:1px solid #fff4;border-radius:25px;padding:10px 18px;background:#23221ebf}.hint{color:#e0dcd3;font-size:13px}.travel{height:3200px}
dialog{position:fixed;inset:auto max(12px,4vw) max(14px,3svh) auto;margin:0;width:min(310px,93vw);max-height:72svh;overflow:auto;overscroll-behavior:contain;border:1px solid #fff3;border-radius:20px;background:#22211be8;backdrop-filter:blur(12px);color:#fffaf1;padding:20px;box-shadow:0 12px 40px #0005}dialog::backdrop{background:transparent}h2{font:normal 27px Georgia,serif;margin:0}header,label{display:flex;justify-content:space-between;align-items:center}header{margin-bottom:14px}header button{padding:6px 12px}label{font-size:13px}output{font-variant-numeric:tabular-nums;color:#d9c9aa}input{width:100%;accent-color:#d9bb88;margin:4px 0 9px}#reset{font-size:13px}button:focus-visible{outline:2px solid #fff}
@media(max-aspect-ratio:1/1){.stage{padding-top:14svh}.scene{width:100%}dialog{max-height:47svh}}
dialog{width:min(375px,96vw);padding:16px;max-height:76svh}dialog button,select{font-size:13px;padding:7px 10px}dialog header{margin-bottom:8px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}select{flex:1;min-width:0}.row button{white-space:nowrap}#sliders{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}input[type=color]{height:32px}#clock{font:14px monospace}#markers{display:flex;gap:5px;flex-wrap:wrap}#markers button.current{border-color:#ebce93}#help{font-size:12px;color:#d6cdbb}#power{width:auto}.screen{mix-blend-mode:screen}.scene{isolation:isolate} @media(max-aspect-ratio:1/1){dialog{max-height:48svh;left:2vw;right:2vw;width:auto;bottom:1svh}}.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--tint,none);mix-blend-mode:color}main{overflow-y:auto;touch-action:pan-y pinch-zoom}.stage{padding-top:0}.hint{font-size:12px}footer{gap:4px}html.mobile-tour .scene{aspect-ratio:9/16;width:min(100%,calc((100svh - 76px)*9/16))}html.mobile-tour .stage::before{background-image:linear-gradient(transparent,#11110fe6),url(mobile-front.jpg)}@media(max-width:650px){footer{width:96%;justify-content:space-between;gap:6px}.hint{display:inline}.pill{padding:8px 12px}}</style></head><body>
<main id="scroller" tabindex="0" aria-label="Malik’s Barbers scroll walkthrough"><section class="stage"><div class="scene"><video id="movie" preload="auto" muted playsinline aria-label="Walk through Malik’s Barbers"></video><canvas class="screen" id="screen" width="1280" height="720" hidden aria-hidden="true"></canvas></div><footer><span class="hint" id="hint">Scroll to explore ↓</span><button class="pill" id="lights" aria-label="Lighting, press three times to open" aria-haspopup="dialog">☼ &nbsp; Lighting</button></footer></section><div class="travel" aria-hidden="true"></div></main>
<dialog id="panel" aria-labelledby="title"><header><h2 id="title">Shop lighting</h2><button id="done">Done</button></header><label for="timeline">Walkthrough <output id="clock"></output></label><input type="range" id="timeline" min="0" max="239" step="1" value="0">
<div class="row"><select id="track" aria-label="Selected light"></select><button id="add">+ Spotlight</button></div>
<label><span>Light on</span><input type="checkbox" id="power"></label><div id="sliders"></div>
<div class="row"><button id="key">Add keyframe here</button><button id="stop">Stop here</button></div><div id="markers" aria-label="Keyframes"></div>
<p id="help">Move the timeline, then adjust the light to record a keyframe. Tap a timestamp to edit it.</p>
<div class="row"><button id="removeKey">Delete keyframe</button><button id="removeLight">Remove spotlight</button></div>
<div class="row"><button id="export">Export preset</button><button id="reset">Reset lighting</button></div></dialog>
<script src="lighting.js?v=device2"></script></body></html>
