<!doctype html>
<html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141310"><title>Malik’s Barbers</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#141310;color:#fffaf1;font:15px/1.4 "DM Sans",Arial,sans-serif;color-scheme:dark}
main{height:100%;height:100svh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.stage{height:100%;position:sticky;top:0;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.stage::before{content:"";position:absolute;z-index:-2;inset:-7%;background:linear-gradient(transparent,#11110fe6),center/cover url(storefront.jpg);filter:blur(34px) brightness(.55)}
.scene{width:min(100%,calc((100svh - 76px)*16/9));aspect-ratio:16/9;position:relative;mask-image:linear-gradient(black 84%,transparent)}
video,.screen{display:block;width:100%;height:100%;position:absolute;inset:0}.screen{pointer-events:none}.screen[hidden]{display:none}
footer{display:flex;align-items:center;justify-content:space-between;width:min(90%,1200px);min-height:64px;gap:16px}button{color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}.pill,dialog button{border:1px solid #fff4;border-radius:25px;padding:10px 18px;background:#23221ebf}.hint{color:#e0dcd3;font-size:13px}.travel{height:3200px}
dialog{position:fixed;inset:auto max(12px,4vw) max(14px,3svh) auto;margin:0;width:min(310px,93vw);max-height:72svh;overflow:auto;overscroll-behavior:contain;border:1px solid #fff3;border-radius:20px;background:#22211be8;backdrop-filter:blur(12px);color:#fffaf1;padding:20px;box-shadow:0 12px 40px #0005}dialog::backdrop{background:transparent}h2{font:normal 27px Georgia,serif;margin:0}header,label{display:flex;justify-content:space-between;align-items:center}header{margin-bottom:14px}header button{padding:6px 12px}label{font-size:13px}output{font-variant-numeric:tabular-nums;color:#d9c9aa}input{width:100%;accent-color:#d9bb88;margin:4px 0 9px}#reset{font-size:13px}button:focus-visible{outline:2px solid #fff}
@media(max-aspect-ratio:1/1){.stage{padding-top:14svh}.scene{width:100%}dialog{max-height:47svh}}
</style></head><body>
<main id="scroller" tabindex="0" aria-label="Malik’s Barbers scroll walkthrough"><section class="stage"><div class="scene"><video id="movie" src="walkthrough.mp4" poster="storefront.jpg" preload="auto" muted playsinline aria-label="Walk through Malik’s Barbers"></video><canvas class="screen" id="screen" width="1280" height="720" hidden aria-hidden="true"></canvas></div><footer><span class="hint" id="hint">Scroll to explore ↓</span><button class="pill" id="lights" aria-label="Lighting, press three times to open" aria-haspopup="dialog">☼ &nbsp; Lighting</button></footer></section><div class="travel" aria-hidden="true"></div></main>
<dialog id="panel" aria-labelledby="title"><header><h2 id="title">Shop lighting</h2><button id="done">Done</button></header><div id="sliders"></div><button id="reset">Reset lighting</button></dialog>
<script src="lighting.js"></script></body></html>
